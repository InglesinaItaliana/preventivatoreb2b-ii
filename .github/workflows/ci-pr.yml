name: Controlli PR
on:
  pull_request:
    branches:
      - main

# Solo lettura: nessun secret, nessuna credenziale Google, nessun deploy.
# Il provider WIF accetta solo refs/heads/main, quindi da una PR non si ottengono
# credenziali nemmeno volendo.
permissions:
  contents: read

# Un nuovo push sulla stessa PR annulla il controllo precedente, ormai inutile.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/functions/package-lock.json

      - name: Install Functions Dependencies
        run: npm ci --prefix src/functions

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm run test

      # Build reale (non solo vue-tsc): è quella che fallisce davvero in deploy.
      - name: Build frontend
        run: npm run build

      # Stessa build che il predeploy di Firebase esegue prima di caricare le functions.
      - name: Build functions
        run: npm --prefix src/functions run build
